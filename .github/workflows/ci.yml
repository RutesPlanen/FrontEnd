name: CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Byg Docker image
        run: docker build -t frontend .

      - name: Kør Docker container
        run: docker run -d -p 80:80 --name frontend-test frontend && sleep 3 && curl -f http://localhost || exit 1

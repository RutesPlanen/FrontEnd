<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutekort – Q-Genbrug</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .leaflet-container { background: #1a1e2a; }
  </style>
</head>
<body>

<aside class="sidebar">
  <a class="sidebar-logo" href="/chauffeur-dashboard.html">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <div><div class="logo-name">Q-Genbrug</div><div class="logo-sub">Chauffør</div></div>
  </a>
  <div class="sidebar-nav">
    <div class="nav-section">Navigation</div>
    <a class="nav-item" href="/chauffeur-dashboard.html" data-page="/chauffeur-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      Ventende afhentninger
    </a>
    <a class="nav-item active" href="/map.html" data-page="/map.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Rutekort
    </a>
    <a class="nav-item" href="/kosten.html" data-page="/kosten.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Mine udgifter
    </a>
  </div>
  <div class="sidebar-footer">
    <div class="user-tile" onclick="logout()">
      <div class="user-avatar" id="user-avatar">–</div>
      <div class="user-info"><div class="user-name" id="user-name">…</div><div class="user-role" id="user-role"></div></div>
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
  </div>
</aside>

<div class="page-wrapper">
  <div class="page-header">
    <div>
      <div class="page-title">Rutekort</div>
      <div class="page-subtitle">Beregn optimal afhentningsrute baseret på ventende anmodninger.</div>
    </div>
  </div>
  <main>
    <div class="card">
      <div class="input-row">
        <label>
          Din startadresse
          <input id="start-input" type="text" class="form-control" placeholder="F.eks. Nørrebrogade 10, 2200 København N" autocomplete="street-address" />
        </label>
        <div class="lager-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="1"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          <span id="lager-tekst">Henter lager…</span>
        </div>
        <button id="btn-beregn" class="btn btn-primary" style="align-self:flex-end;white-space:nowrap;">Beregn rute</button>
      </div>

      <div id="loading-bar">
        <div class="spinner"></div>
        <span id="loading-tekst">Beregner…</span>
      </div>

      <div class="stats-bar" id="stats-bar">
        <div class="stat-box"><strong id="stat-stops">–</strong><span>Stop</span></div>
        <div class="stat-box"><strong id="stat-distance">–</strong><span>Distance</span></div>
        <div class="stat-box"><strong id="stat-duration">–</strong><span>Tid</span></div>
      </div>

      <div class="map-and-stops">
        <div id="map"></div>

        <div id="stop-panel">
          <div class="stop-panel-header">
            <h3>Rækkefølge</h3>
            <button id="btn-opdater">↻ Opdater</button>
          </div>
          <ol id="stop-list"></ol>
        </div>
      </div>

      <p id="empty-msg">Ingen restauranter med ventende afhentninger fundet.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/map.js"></script>
</body>
</html>

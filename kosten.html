<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine udgifter – Q-Genbrug</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <a class="sidebar-logo" href="/chauffeur-dashboard.html">
        <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div><div class="logo-name">Q-Genbrug</div><div class="logo-sub">Chauffør</div></div>
    </a>
    <div class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        <a class="nav-item" href="/chauffeur-dashboard.html" data-page="/chauffeur-dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            Ventende afhentninger
        </a>
        <a class="nav-item" href="/map.html" data-page="/map.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
            Rutekort
        </a>
        <a class="nav-item active" href="/kosten.html" data-page="/kosten.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Mine udgifter
        </a>
    </div>
    <div class="sidebar-footer">
        <div class="user-tile" onclick="logout()">
            <div class="user-avatar" id="user-avatar">–</div>
            <div class="user-info"><div class="user-name" id="user-name">…</div><div class="user-role" id="user-role"></div></div>
            <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </div>
</aside>

<div class="page-wrapper">
    <div class="page-header">
        <div>
            <div class="page-title">Mine udgifter</div>
            <div class="page-subtitle">Registrér og se dine chauffør-udgifter med bilag.</div>
        </div>
    </div>
    <main>
        <div class="main-grid">
            <div class="card">
                <div class="card-header"><span class="card-title">Udgifter</span></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr><th>Dato</th><th>Kategori</th><th>Beløb</th><th>Beskrivelse</th><th>Bilag</th><th></th></tr>
                        </thead>
                        <tbody id="expense-list">
                        <tr><td colspan="6" class="empty">Indlæser…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2 style="margin-bottom:16px;">Registrer udgift</h2>
                <div style="display:grid;grid-template-columns:1fr;gap:12px;">
                    <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Kategori
                        <select id="exp-category" class="form-control">
                            <option value="">Vælg kategori</option>
                            <option value="Benzin">Benzin</option>
                            <option value="Parkering">Parkering</option>
                            <option value="Mad">Mad</option>
                            <option value="Udstyr">Udstyr</option>
                            <option value="Andet">Andet</option>
                        </select>
                    </label>
                    <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Beløb (kr.)
                        <input id="exp-amount" type="number" step="0.01" min="0" class="form-control" placeholder="0.00" />
                    </label>
                    <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Beskrivelse
                        <input id="exp-description" class="form-control" placeholder="F.eks. brændstof til afhentningsrunde" />
                    </label>
                    <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Bilag (foto/screenshot)
                        <input type="file" id="image-input" accept="image/*" style="padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:0.82rem;" />
                        <img id="image-preview" class="preview-img" alt="Forhåndsvisning" />
                    </label>
                    <button class="btn btn-primary" id="exp-submit" onclick="gemUdgift()">Gem udgift</button>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/kosten.js"></script>
</body>
</html>

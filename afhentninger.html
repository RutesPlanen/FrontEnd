<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afhentninger – Q-Genbrug</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <a class="sidebar-logo" href="/restauranter.html">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <div><div class="logo-name">Q-Genbrug</div><div class="logo-sub">Pantindsamling</div></div>
  </a>
  <div class="sidebar-nav">
    <div class="nav-section">Overblik</div>
    <a class="nav-item" href="/statistik.html" data-page="/statistik.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Statistik</a>
    <div class="nav-section">Håndtering</div>
    <a class="nav-item" href="/anmodninger.html" data-page="/anmodninger.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>Anmodninger</a>
    <a class="nav-item active" href="/afhentninger.html" data-page="/afhentninger.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>Afhentninger</a>
    <a class="nav-item" href="/udgifter.html" data-page="/udgifter.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Udgifter</a>
    <div class="nav-section">Administration</div>
    <a class="nav-item" href="/restauranter.html" data-page="/restauranter.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>Restauranter</a>
    <a class="nav-item" href="/brugere.html" data-page="/brugere.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.87"/></svg>Brugere</a>
  </div>
  <div class="sidebar-footer">
    <div class="user-tile" onclick="logout()">
      <div class="user-avatar" id="user-avatar">–</div>
      <div class="user-info"><div class="user-name" id="user-name">…</div><div class="user-role" id="user-role"></div></div>
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
  </div>
</aside>

<div class="page-wrapper">
  <div class="page-header">
    <div>
      <div class="page-title">Afhentninger</div>
      <div class="page-subtitle">Registrér og se alle gennemførte afhentninger.</div>
    </div>
  </div>
  <main>
    <div class="main-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">Alle afhentninger</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Anmodning</th><th>Chauffør</th><th>Pris</th><th>Registreret</th><th>Note</th></tr></thead>
            <tbody id="afhentninger-list"><tr><td colspan="5" class="empty">Indlæser…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:16px;">Registrer afhentning</h2>
        <div style="display:grid;grid-template-columns:1fr;gap:12px;">
          <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Anmodning
            <select id="anmodning-select" class="form-control"><option value="">Indlæser…</option></select>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Chauffør
            <select id="chauffeur-select" class="form-control"><option value="">Indlæser…</option></select>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Pris (kr.)
            <input id="afh-cost" type="number" step="0.01" min="0" class="form-control" placeholder="0.00" />
          </label>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:0.75rem;font-weight:500;color:var(--text3);">Note
            <input id="afh-note" class="form-control" placeholder="Eventuelle bemærkninger" />
          </label>
          <button class="btn btn-primary" id="afh-submit" onclick="registrerAfhentning()">Registrer afhentning</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/afhentninger.js"></script>
</body>
</html>
